<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warframe 开放世界 · 大地图 | The Maps</title>
  <link rel="icon" type="image/png" href="/picture/websitelogo.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/map/map.css">
  <style>
    /* ════════════════════════════════════════════════════════════
       Splash Screen — ALL inline (same as worldstate)
       ════════════════════════════════════════════════════════════ */
    :root {
      --ws-gold: #c9a432;
      --ws-gold-bright: #e2c060;
      --ws-gold-dim: rgba(201,164,50,.45);
      --ws-gold-glow: rgba(201,164,50,.18);
      --ws-gold-line: rgba(201,164,50,.28);
    }
    #map-splash {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #070503; overflow: hidden;
      transition: opacity .8s cubic-bezier(.4,0,.2,1), visibility .8s;
    }
    #map-splash.ws-splash--done { opacity: 0; visibility: hidden; pointer-events: none; }
    /* 格线底纹 */
    #map-splash::before {
      content: ''; position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(201,164,50,.038) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,164,50,.038) 1px, transparent 1px);
      background-size: 54px 54px; pointer-events: none;
    }
    /* 暗角 vignette */
    #map-splash::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 72% 72% at 50% 50%, transparent 32%, rgba(4,2,1,.82) 100%);
      pointer-events: none;
    }
    /* 扫描线 */
    .map-spl-scan {
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent 0%, rgba(201,164,50,0) 7%, rgba(201,164,50,.96) 50%, rgba(201,164,50,0) 93%, transparent 100%);
      box-shadow: 0 0 18px 7px rgba(201,164,50,.32), 0 0 44px 18px rgba(201,164,50,.1);
      animation: wsSplScan 2.7s cubic-bezier(.37,0,.63,1) infinite; z-index: 1;
    }
    @keyframes wsSplScan {
      0% { transform: translateY(0); opacity: 0; }
      4% { opacity: 1; }
      88% { opacity: .75; }
      100% { transform: translateY(100vh); opacity: 0; }
    }
    /* 角框 */
    .map-spl-corner { position: absolute; width: 52px; height: 52px; z-index: 3; opacity: 0; }
    .map-spl-corner--tl { top: 2.2rem; left: 2.2rem; border-top: 1.5px solid var(--ws-gold); border-left: 1.5px solid var(--ws-gold); animation: wsSplBrTL .55s .06s cubic-bezier(.22,1,.36,1) forwards; }
    .map-spl-corner--tr { top: 2.2rem; right: 2.2rem; border-top: 1.5px solid var(--ws-gold); border-right: 1.5px solid var(--ws-gold); animation: wsSplBrTR .55s .1s cubic-bezier(.22,1,.36,1) forwards; }
    .map-spl-corner--bl { bottom: 2.2rem; left: 2.2rem; border-bottom: 1.5px solid var(--ws-gold); border-left: 1.5px solid var(--ws-gold); animation: wsSplBrBL .55s .14s cubic-bezier(.22,1,.36,1) forwards; }
    .map-spl-corner--br { bottom: 2.2rem; right: 2.2rem; border-bottom: 1.5px solid var(--ws-gold); border-right: 1.5px solid var(--ws-gold); animation: wsSplBrBR .55s .18s cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes wsSplBrTL { from { opacity:0; transform:translate(-10px,-10px); } to { opacity:1; transform:translate(0,0); } }
    @keyframes wsSplBrTR { from { opacity:0; transform:translate(10px,-10px); } to { opacity:1; transform:translate(0,0); } }
    @keyframes wsSplBrBL { from { opacity:0; transform:translate(-10px,10px); } to { opacity:1; transform:translate(0,0); } }
    @keyframes wsSplBrBR { from { opacity:0; transform:translate(10px,10px); } to { opacity:1; transform:translate(0,0); } }
    /* 侧边数据流 */
    .map-spl-side {
      position: absolute; top: 0; bottom: 0; width: 148px; padding: 0 1rem;
      display: flex; align-items: center;
      font-family: 'Rajdhani', monospace; font-size: .66rem; line-height: 2.1; letter-spacing: .05em;
      color: rgba(201,164,50,.2); overflow: hidden; user-select: none; z-index: 1;
      opacity: 0; animation: wsSplFI0 .5s .85s ease forwards;
    }
    @keyframes wsSplFI0 { to { opacity: 1; } }
    .map-spl-side--l { left: 0; text-align: left; }
    .map-spl-side--r { right: 0; text-align: right; }
    .map-spl-side::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 28%; background: linear-gradient(180deg, #070503, transparent); z-index: 1; pointer-events: none; }
    .map-spl-side::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 28%; background: linear-gradient(0deg, #070503, transparent); z-index: 1; pointer-events: none; }
    /* 中央主体 */
    .map-spl-center { position: relative; z-index: 5; display: flex; flex-direction: column; align-items: center; transform: scale(1.15); transform-origin: center center; }
    /* 六边形区域 */
    .map-spl-hex-area { position: relative; width: 186px; height: 186px; display: flex; align-items: center; justify-content: center; margin-bottom: 1.8rem; flex-shrink: 0; }
    .map-spl-hex-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .map-spl-hex-wrap.map-spl-hex-spinning { animation: wsSplHexSpin 24s linear infinite; }
    @keyframes wsSplHexSpin { to { transform: rotate(360deg); } }
    .map-spl-ring-svg { width: 100%; height: 100%; overflow: visible; }
    /* 主边框圆圈描边动画 (r=88, 周长≈553) */
    .map-spl-ring-o { fill: none; stroke: rgba(201,164,50,.88); stroke-width: 1.5; stroke-dasharray: 553; stroke-dashoffset: 553; filter: drop-shadow(0 0 6px rgba(201,164,50,.55)); animation: wsSplDash553 1s .1s cubic-bezier(.4,0,.2,1) forwards; }
    /* 内圈描边动画 (r=76, 周长≈477) */
    .map-spl-ring-i { fill: rgba(201,164,50,.025); stroke: rgba(201,164,50,.24); stroke-width: 1; stroke-dasharray: 477; stroke-dashoffset: 477; animation: wsSplDash477 .95s .28s cubic-bezier(.4,0,.2,1) forwards; }
    .map-spl-ring-tk { stroke: rgba(201,164,50,.55); stroke-width: 1.5; stroke-linecap: round; opacity: 0; animation: wsSplFI0 .3s 1.0s ease forwards; }
    @keyframes wsSplDash553 { to { stroke-dashoffset: 0; } }
    @keyframes wsSplDash477 { to { stroke-dashoffset: 0; } }
    /* Logo 圆形容器 */
    .map-spl-logo-cnt { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2; width: 128px; height: 128px; border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0; animation: wsSplFI0 .65s .9s ease forwards; }
    .map-spl-logo-bg { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 55%, rgba(22,16,9,.82) 0%, rgba(10,7,3,.96) 55%, rgba(5,3,1,.99) 100%); border: 1.5px solid rgba(201,164,50,.42); box-shadow: inset 0 0 28px rgba(201,164,50,.1), inset 0 -8px 24px rgba(201,164,50,.06), 0 0 24px rgba(201,164,50,.18), 0 0 60px rgba(201,164,50,.07); }
    .map-spl-logo-img { position: relative; z-index: 1; width: 78%; height: 78%; object-fit: contain; filter: drop-shadow(0 0 10px rgba(201,164,50,.5)) drop-shadow(0 2px 8px rgba(0,0,0,.6)); display: block; }
    /* 标题 */
    .map-spl-label-cn { font-family: 'Noto Sans SC', sans-serif; font-size: 1.55rem; font-weight: 700; letter-spacing: .26em; color: rgba(230,210,168,.92); text-shadow: 0 0 20px rgba(201,164,50,.22); opacity: 0; transform: translateY(14px); animation: wsSplUp .55s 1.0s cubic-bezier(.22,1,.36,1) forwards; margin-bottom: .35rem; }
    .map-spl-label-en { font-family: 'Orbitron', sans-serif; font-size: .66rem; font-weight: 700; letter-spacing: .32em; color: rgba(201,164,50,.48); opacity: 0; transform: translateY(10px); animation: wsSplUp .55s 1.1s cubic-bezier(.22,1,.36,1) forwards; margin-bottom: 1.55rem; }
    .map-spl-label-en .map-spl-dot { color: rgba(201,164,50,.8); margin: 0 .18em; }
    @keyframes wsSplUp { to { opacity: 1; transform: translateY(0); } }
    /* 状态行 */
    .map-spl-sr { display: flex; align-items: center; gap: .65rem; opacity: 0; margin-bottom: .9rem; animation: wsSplFI0 .4s 1.24s ease forwards; }
    .map-spl-sr-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ws-gold); box-shadow: 0 0 7px rgba(201,164,50,.9); animation: wsSplDotBlink .65s 1.24s ease-in-out infinite alternate; flex-shrink: 0; }
    @keyframes wsSplDotBlink { from { opacity: .32; box-shadow: 0 0 3px rgba(201,164,50,.35); } to { opacity: 1; box-shadow: 0 0 10px rgba(201,164,50,1); } }
    .map-spl-sr-txt { font-family: 'Rajdhani', sans-serif; font-size: .82rem; font-weight: 600; letter-spacing: .18em; color: rgba(201,164,50,.72); }
    /* 进度条 */
    .map-spl-bar { display: flex; align-items: center; gap: .75rem; opacity: 0; margin-bottom: .88rem; animation: wsSplFI0 .4s 1.37s ease forwards; }
    .map-spl-bar-track { width: 244px; height: 2px; background: rgba(201,164,50,.1); position: relative; }
    .map-spl-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, rgba(201,164,50,.44), rgba(226,192,96,.95)); transition: width .24s ease; position: relative; }
    .map-spl-bar-fill::after { content: ''; position: absolute; left: 100%; top: -3px; width: 2px; height: 8px; margin-left: -1px; background: #fffae0; box-shadow: 0 0 8px 3px rgba(201,164,50,.92); }
    .map-spl-bar-pct { font-family: 'Orbitron', sans-serif; font-size: .68rem; font-weight: 700; color: rgba(201,164,50,.58); letter-spacing: .06em; min-width: 2.4rem; text-align: right; }
    /* 信息行 */
    .map-spl-info { font-family: 'Rajdhani', monospace; font-size: .72rem; letter-spacing: .1em; color: rgba(201,164,50,.33); opacity: 0; animation: wsSplFI0 .4s 1.54s ease forwards; min-height: 1.1em; }
    /* 底栏 */
    .map-spl-footer { position: absolute; bottom: 1.4rem; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 2.8rem; font-family: 'Rajdhani', sans-serif; font-size: .68rem; letter-spacing: .14em; color: rgba(201,164,50,.28); z-index: 4; opacity: 0; animation: wsSplFI0 .5s 1.06s ease forwards; }
    @media (max-width: 640px) {
      .map-spl-side { display: none; }
      .map-spl-hex-area { width: 148px; height: 148px; margin-bottom: 1.35rem; }
      .map-spl-logo-cnt { width: 102px; height: 102px; }
      .map-spl-bar-track { width: 176px; }
      .map-spl-label-cn { font-size: 1.25rem; }
      .map-spl-corner { width: 38px; height: 38px; }
      .map-spl-corner--tl, .map-spl-corner--tr { top: 1.2rem; }
      .map-spl-corner--bl, .map-spl-corner--br { bottom: 1.2rem; }
      .map-spl-corner--tl, .map-spl-corner--bl { left: 1.2rem; }
      .map-spl-corner--tr, .map-spl-corner--br { right: 1.2rem; }
    }
  </style>
</head>
<body>
  <!-- Page Entry Splash (same as worldstate) -->
  <div id="map-splash" aria-hidden="true" role="status" aria-label="正在加载地图数据">

    <div class="map-spl-scan"></div>

    <div class="map-spl-corner map-spl-corner--tl"></div>
    <div class="map-spl-corner map-spl-corner--tr"></div>
    <div class="map-spl-corner map-spl-corner--bl"></div>
    <div class="map-spl-corner map-spl-corner--br"></div>

    <div class="map-spl-side map-spl-side--l" id="map-spl-left"></div>
    <div class="map-spl-side map-spl-side--r" id="map-spl-right"></div>

    <div class="map-spl-center">
      <div class="map-spl-hex-area">
        <div class="map-spl-hex-wrap" id="map-spl-hex-wrap">
          <svg class="map-spl-ring-svg" viewBox="-110 -110 220 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <!-- 外侧装饰弧段 (r=102, 周长≈641, 4段弧) -->
            <circle cx="0" cy="0" r="102" fill="none"
                    stroke="rgba(201,164,50,.35)" stroke-width="1"
                    stroke-dasharray="30 130"/>
            <!-- 主边框圆圈，绘制动画 -->
            <circle class="map-spl-ring-o" cx="0" cy="0" r="88"/>
            <!-- 内圈，绘制动画 -->
            <circle class="map-spl-ring-i" cx="0" cy="0" r="76"/>
            <!-- 四方位刻度线 -->
            <line class="map-spl-ring-tk" x1="0"   y1="-88" x2="0"   y2="-100"/>
            <line class="map-spl-ring-tk" x1="88"  y1="0"   x2="100" y2="0"/>
            <line class="map-spl-ring-tk" x1="0"   y1="88"  x2="0"   y2="100"/>
            <line class="map-spl-ring-tk" x1="-88" y1="0"   x2="-100" y2="0"/>
          </svg>
        </div>
        <div class="map-spl-logo-cnt">
          <div class="map-spl-logo-bg"></div>
          <img class="map-spl-logo-img" src="picture/WS-logo-2.png" alt="" aria-hidden="true">
        </div>
      </div>

      <div class="map-spl-label-cn">开放世界 · 大地图</div>
      <div class="map-spl-label-en">LANDSCAPES' MAPS <span class="map-spl-dot">◈</span> TACTICAL OVERLAY</div>

      <div class="map-spl-sr">
        <span class="map-spl-sr-dot"></span>
        <span class="map-spl-sr-txt" id="map-spl-status">ESTABLISHING TACTICAL LINK</span>
      </div>

      <div class="map-spl-bar">
        <div class="map-spl-bar-track">
          <div class="map-spl-bar-fill" id="map-spl-bar-fill"></div>
        </div>
        <span class="map-spl-bar-pct" id="map-spl-bar-pct">0%</span>
      </div>

      <div class="map-spl-info" id="map-spl-info">// INITIALIZING LANDSCAPE MAP SYSTEM</div>
    </div>

    <div class="map-spl-footer">
      <span>WFSpeed.run</span>
      <span>TENNO TACTICAL NETWORK</span>
      <span id="map-spl-utc">UTC 00:00:00</span>
    </div>
  </div>

  <!-- Top Bar -->
  <header class="map-topbar">
    <div class="topbar-left">
      <a href="/" class="topbar-logo" aria-label="返回首页">
        <span>WFSPEED</span>
      </a>
      <div class="topbar-divider"></div>
      <h1 class="topbar-title">Landscapes' Maps</h1>
    </div>
    <div class="topbar-center">
      <div class="cycle-indicator" id="cycleIndicator">
        <div class="cycle-icon" id="cycleIcon"></div>
        <div class="cycle-info">
          <span class="cycle-name" id="cycleName">--</span>
          <span class="cycle-timer" id="cycleTimer">--:--</span>
        </div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
          <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="text" id="searchInput" placeholder="搜索地点..." autocomplete="off">
        <kbd>/</kbd>
      </div>
      <div class="lang-toggle" id="langToggle" title="切换语言 / Switch Language">
        <button class="lang-btn active" data-lang="zh">中文</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
      <button class="topbar-btn" id="favToggle" title="仅显示收藏">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="map-layout">
    <!-- Map Tabs (Vertical) -->
    <nav class="map-nav" id="mapNav">
      <button class="nav-tab active" data-map="duviri">
        <div class="nav-tab-icon">◇</div>
        <div class="nav-tab-label">双衍王境</div>
        <div class="nav-tab-state" id="stateDuviri"></div>
      </button>
      <button class="nav-tab" data-map="plains-of-eidolon">
        <div class="nav-tab-icon">◈</div>
        <div class="nav-tab-label">夜灵平野</div>
        <div class="nav-tab-state" id="statePlainsOfEidolon"></div>
      </button>
      <button class="nav-tab" data-map="orb-vallis">
        <div class="nav-tab-icon">◉</div>
        <div class="nav-tab-label">奥布山谷</div>
        <div class="nav-tab-state" id="stateOrbVallis"></div>
      </button>
      <button class="nav-tab" data-map="cambion-drift">
        <div class="nav-tab-icon">◎</div>
        <div class="nav-tab-label">魔胎之境</div>
        <div class="nav-tab-state" id="stateCambionDrift"></div>
      </button>
    </nav>

    <!-- Sidebar -->
    <aside class="map-sidebar" id="mapSidebar">
      <div class="sidebar-header">
        <h2 class="sidebar-title">筛选</h2>
        <div class="sidebar-actions">
          <button class="sidebar-btn" id="selectAll">全选</button>
          <button class="sidebar-btn" id="clearAll">清除</button>
        </div>
      </div>
      <div class="sidebar-stats">
        <span id="statTotal">0</span> 个地点 · <span id="statVisible">0</span> 个显示
      </div>
      <!-- Favorites Panel -->
      <div class="fav-panel" id="favPanel">
        <div class="fav-panel-header">
          <div class="fav-panel-icon">★</div>
          <div class="fav-panel-name">我的收藏</div>
          <div class="fav-panel-count" id="favPanelCount">0</div>
          <div class="fav-panel-arrow">▼</div>
        </div>
        <div class="fav-panel-items" id="favPanelItems">
          <div class="fav-empty">暂无收藏</div>
        </div>
      </div>
      <div class="sidebar-groups" id="sidebarGroups"></div>
    </aside>

    <!-- Map Container -->
    <div class="map-container">
      <div id="map"></div>
      <!-- Loading Spinner -->
      <div class="map-loading" id="mapLoading">
        <div class="map-loading-spinner"></div>
        <div class="map-loading-text">地图加载中...</div>
      </div>
      <!-- Map Overlay Info -->
      <div class="map-overlay-info" id="mapOverlayInfo">
        <div class="overlay-coords" id="overlayCoords">0, 0</div>
      </div>
    </div>

    <!-- Right Sidebar: Location List -->
    <aside class="map-locpanel" id="locPanel">
      <div class="locpanel-header">
        <h2 class="locpanel-title">地点列表</h2>
        <div class="locpanel-stats">
          <span id="locTotal">0</span> 地点 · <span id="locCatCount">0</span> 分类
        </div>
      </div>
      <div class="locpanel-controls">
        <div class="locpanel-sort">
          <label class="locpanel-sort-label">排序</label>
          <select id="locSort" class="locpanel-sort-select">
            <option value="wiki">Wiki 顺序</option>
            <option value="name">按名称</option>
            <option value="category">按分类</option>
            <option value="nearest">距离最近</option>
          </select>
        </div>
        <button class="locpanel-fav-toggle" id="locFavToggle" title="仅显示收藏">
          <span class="locpanel-fav-icon">☆</span>
          <span class="locpanel-fav-count" id="locFavCount">0</span>
        </button>
      </div>
      <div class="locpanel-list" id="locList">
        <div class="locpanel-empty">加载中...</div>
      </div>
    </aside>
  </div>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- Translations -->
  <script src="/map/translations.js?v=20260801a"></script>
  <!-- Map Logic -->
  <script src="/map/map.js?v=20260801b"></script>
</body>
</html>
