<!DOCTYPE html>
<html lang="zh-CN" class="fonts-loading" data-fui-theme="cyber">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WTF EELOG — Warframe EE.log 分析器</title>
  <link rel="icon" href="log/picture/WS-logo-2.png">
  <link rel="preload" href="picture/WS-logo-2.png" as="image">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #03040a; color: #f0f4ff;
      font-family: 'XSZT', 'Microsoft YaHei', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body { padding-top: 0 !important; }

    /* ═══ 加载屏 — 标准 Logo ═══ */
    #el-overlay {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: clamp(10px, 2.2vh, 22px);
      background: radial-gradient(circle at 50% 44%, #0b1218, #070a0d 55%, #000);
      overflow: hidden;
    }
    .el-matrix { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(90deg, rgba(95,208,232,.14) 0 1px, transparent 1px 38px); mask-image: radial-gradient(circle, #000, transparent 72%); -webkit-mask-image: radial-gradient(circle, #000, transparent 72%); }
    .el-core { position: relative; width: clamp(180px, 30vmin, 280px); height: clamp(180px, 30vmin, 280px); }
    .el-ring { position: absolute; border-radius: 50%; }
    .el-ring1 { inset: 0; border: 2px dashed rgba(95,208,232,.6); }
    .el-ring2 { inset: 8%; border: 2px solid transparent; border-top-color: #5fd0e8; border-left-color: rgba(95,208,232,.3); }
    .el-ring3 { inset: 16%; border: 1px dotted rgba(0,255,200,.3); }
    .el-logo { position: absolute; inset: 18%; width: 64%; height: 64%; border-radius: 50%; object-fit: cover; mix-blend-mode: screen; pointer-events: none; }
    .el-title { font-size: clamp(1.3rem, 4.5vmin, 2.4rem); letter-spacing: .48em; text-indent: .48em; color: #5fd0e8; text-shadow: 0 0 6px rgba(95,208,232,.9), 0 0 18px rgba(95,208,232,.5); white-space: nowrap; }
    .el-sub { font-size: clamp(.75rem, 2vmin, .9rem); letter-spacing: .22em; color: rgba(95,208,232,.45); }
    .el-d { display: inline-block; margin-left: .28em; }
    .el-bar { width: clamp(200px, 34vmin, 320px); max-width: 80vw; height: 2px; border-radius: 1px; overflow: hidden; background: rgba(95,208,232,.1); }
    .el-bar span { display: block; height: 100%; width: 35%; background: linear-gradient(90deg, transparent, #5fd0e8, rgba(0,255,200,.9), transparent); box-shadow: 0 0 8px rgba(95,208,232,.6); }
    .el-status { font-size: clamp(.65rem, 1.7vmin, .8rem); letter-spacing: .14em; color: rgba(95,208,232,.3); }

    /* ═══ 主页 ═══ */
    html.fonts-loading #eelog-main { opacity: 0; }
    html.fonts-loaded #eelog-main { opacity: 1; }
    #eelog-main {
      position: fixed; inset: 0; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0;
    }

    /* 标题区域 */
    .el-title-area {
      display: flex; flex-direction: column;
      align-items: center; gap: 0;
      opacity: 0;
      padding: clamp(10px, 2vh, 20px) 0 0;
    }

    /* WTF 行 */
    .el-wtf-line {
      position: relative;
      cursor: pointer;
      text-align: center;
    }
    .el-wtf {
      display: inline-block;
      font-size: clamp(10rem, 32vmin, 26rem);
      font-weight: 900;
      letter-spacing: .22em;
      color: #f0f4ff;
      text-shadow:
        0 0 30px rgba(95,208,232,.8),
        0 0 60px rgba(95,208,232,.5),
        0 0 120px rgba(95,208,232,.25);
      line-height: .85;
      margin-bottom: clamp(8px, 1.5vh, 16px);
    }

    /* "What the Frame?" — 超大字号居中 */
    .el-wtf-full {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(5rem, 14vmin, 12rem);
      font-weight: 900;
      letter-spacing: .06em;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      line-height: 1;
    }
    .el-wtf-full .wf-w, .el-wtf-full .wf-f {
      color: #5fd0e8;
      text-shadow: 0 0 25px rgba(95,208,232,.9), 0 0 60px rgba(95,208,232,.5), 0 0 120px rgba(0,255,200,.3);
    }
    .el-wtf-full .wf-rest { color: rgba(240,244,255,.6); }
    .el-wtf-full .wf-q { color: rgba(95,208,232,.6); }

    /* EELOG — 逐字母多彩辉光 */
    .el-eelog {
      font-size: clamp(6rem, 22vmin, 18rem);
      font-weight: 900;
      letter-spacing: .32em;
      line-height: .9;
    }
    .el-eelog .ee { display: inline-block; }
    .el-eelog .ee-e1 { color: #5fd0e8; text-shadow: 0 0 30px rgba(95,208,232,.8), 0 0 60px rgba(95,208,232,.4), 0 0 120px rgba(95,208,232,.2); }
    .el-eelog .ee-e2 { color: #41ff8e; text-shadow: 0 0 30px rgba(65,255,142,.8), 0 0 60px rgba(65,255,142,.4), 0 0 120px rgba(65,255,142,.2); }
    .el-eelog .ee-l { color: #a86bff; text-shadow: 0 0 30px rgba(168,107,255,.8), 0 0 60px rgba(168,107,255,.4), 0 0 120px rgba(168,107,255,.2); }
    .el-eelog .ee-o { color: #ff5fd5; text-shadow: 0 0 30px rgba(255,95,232,.8), 0 0 60px rgba(255,95,232,.4), 0 0 120px rgba(255,95,232,.2); }
    .el-eelog .ee-g { color: #ffb648; text-shadow: 0 0 30px rgba(255,182,72,.8), 0 0 60px rgba(255,182,72,.4), 0 0 120px rgba(255,182,72,.2); }

    /* ═══ HUD 装饰侧边栏 ═══ */
    .el-hud-left, .el-hud-right {
      position: fixed; top: 0; bottom: 0; width: 60px;
      z-index: 3; pointer-events: none;
      display: flex; flex-direction: column;
      justify-content: space-between; align-items: center;
      padding: 80px 0;
    }
    .el-hud-left { left: 0; }
    .el-hud-right { right: 0; }
    .el-hud-bar {
      width: 2px; flex: 1;
      background: linear-gradient(180deg, transparent, rgba(95,208,232,.15), rgba(168,107,255,.12), rgba(95,208,232,.15), transparent);
    }
    .el-hud-data {
      font-family: monospace;
      font-size: 9px;
      letter-spacing: .1em;
      color: rgba(95,208,232,.2);
      writing-mode: vertical-rl;
      white-space: nowrap;
    }

    /* ═══ 顶部/底部数据条 ═══ */
    .el-data-strip {
      position: fixed; left: 80px; right: 80px; height: 1px;
      z-index: 3; pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(95,208,232,.1), rgba(168,107,255,.08), rgba(95,208,232,.1), transparent);
    }
    .el-data-strip--top { top: clamp(30px, 5vh, 60px); }
    .el-data-strip--bottom { bottom: clamp(30px, 5vh, 60px); }

    /* ═══ 副标题 — 强制两行 ═══ */
    .el-hero-sub {
      display: flex; flex-direction: column;
      align-items: center; gap: 6px;
      opacity: 0;
      margin-top: clamp(8px, 1.5vh, 16px);
    }
    .el-hero-sub .line1 {
      display: block;
      font-size: clamp(.85rem, 2.4vmin, 1.15rem);
      color: rgba(240,244,255,.5);
      letter-spacing: .18em;
    }
    .el-hero-sub .line2 {
      display: block;
      font-size: clamp(.72rem, 1.8vmin, .9rem);
      color: rgba(95,208,232,.45);
      letter-spacing: .12em;
    }

    /* ═══ CTA — 赛博命令风格 ═══ */
    .el-cta {
      position: relative;
      display: inline-flex; align-items: center; gap: 14px;
      padding: clamp(10px, 1.4vh, 14px) clamp(24px, 3vw, 36px);
      border: none;
      background: transparent;
      color: #5fd0e8;
      font-family: 'Courier New', monospace;
      font-size: clamp(.75rem, 1.8vmin, .95rem);
      font-weight: 700;
      letter-spacing: .25em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      opacity: 0;
      -webkit-user-select: none; user-select: none;
      margin-top: clamp(24px, 4vh, 44px);
    }
    .el-cta-bracket {
      position: absolute;
      width: 14px; height: 14px;
      border-color: #5fd0e8;
      border-style: solid;
      border-width: 0;
      opacity: .6;
      transition: opacity .3s, border-color .3s;
    }
    .el-cta-bracket--tl { top: 0; left: 0; border-top-width: 1.5px; border-left-width: 1.5px; }
    .el-cta-bracket--tr { top: 0; right: 0; border-top-width: 1.5px; border-right-width: 1.5px; }
    .el-cta-bracket--bl { bottom: 0; left: 0; border-bottom-width: 1.5px; border-left-width: 1.5px; }
    .el-cta-bracket--br { bottom: 0; right: 0; border-bottom-width: 1.5px; border-right-width: 1.5px; }
    .el-cta-text { position: relative; z-index: 2; }
    .el-cta-cursor {
      display: inline-block;
      width: 8px; height: 1.1em;
      background: #5fd0e8;
      margin-left: 4px;
      animation: blink-cursor 1s steps(1) infinite;
      vertical-align: middle;
      opacity: .7;
    }
    @keyframes blink-cursor { 0%,50% { opacity: .7; } 51%,100% { opacity: 0; } }
    /* 扫描线穿过按钮 */
    .el-cta-scan {
      position: absolute; inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .el-cta-scan-line {
      position: absolute; left: 0; right: 0; top: -100%; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(95,208,232,.5), rgba(65,255,142,.4), rgba(95,208,232,.5), transparent);
      opacity: 0;
    }

    #el-svg { position: fixed; inset: 0; z-index: 2; pointer-events: none; }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>

<div id="el-overlay" aria-hidden="true">
  <div class="el-matrix"></div>
  <div class="el-core">
    <div class="el-ring el-ring1"></div>
    <div class="el-ring el-ring2"></div>
    <div class="el-ring el-ring3"></div>
    <img class="el-logo" src="picture/WS-logo-2.png" alt="WS">
  </div>
  <div class="el-title">WTF&nbsp;EELOG</div>
  <div class="el-sub">EE.LOG&nbsp;ANALYZER<span class="el-d">·</span><span class="el-d">·</span><span class="el-d">·</span></div>
  <div class="el-bar"><span></span></div>
  <div class="el-status">正在初始化解析引擎</div>
</div>

<div id="eelog-main">
  <!-- HUD 侧边栏 -->
  <div class="el-hud-left">
    <div class="el-hud-data" id="hudL1">CSC Alliance</div>
    <div class="el-hud-bar"></div>
    <div class="el-hud-data" id="hudL2">EST.2024</div>
  </div>
  <div class="el-hud-right">
    <div class="el-hud-data" id="hudR1">EELOG Analyzer</div>
    <div class="el-hud-bar"></div>
    <div class="el-hud-data" id="hudR2">v3.15.0</div>
  </div>

  <!-- 顶部/底部装饰线 -->
  <div class="el-data-strip el-data-strip--top"></div>
  <div class="el-data-strip el-data-strip--bottom"></div>

  <!-- 标题区域 -->
  <div class="el-title-area" id="elTitleArea">
    <div class="el-wtf-line" id="elWtfLine">
      <span class="el-wtf" id="elWtf">WTF</span>
      <span class="el-wtf-full" id="elWtfFull"><span class="wf-w">W</span><span class="wf-rest">hat </span><span class="wf-rest">the </span><span class="wf-f">F</span><span class="wf-rest">rame</span><span class="wf-q">?</span></span>
    </div>
    <div class="el-eelog" id="elEelog"><span class="ee ee-e1">E</span><span class="ee ee-e2">E</span><span class="ee ee-l">L</span><span class="ee ee-o">O</span><span class="ee ee-g">G</span></div>
  </div>

  <!-- 副标题 -->
  <div class="el-hero-sub" id="elSub">
    <span class="line1">所有任务类型的日志皆可解析</span>
    <span class="line2">在毫厘之间，享受进步的快感</span>
  </div>

  <!-- CTA -->
  <a href="log/analyzer.html?tab=disruption" class="el-cta" id="elCta">
    <span class="el-cta-bracket el-cta-bracket--tl"></span>
    <span class="el-cta-bracket el-cta-bracket--tr"></span>
    <span class="el-cta-bracket el-cta-bracket--bl"></span>
    <span class="el-cta-bracket el-cta-bracket--br"></span>
    <span class="el-cta-scan"><span class="el-cta-scan-line"></span></span>
    <span class="el-cta-text">INITIATE ANALYSIS</span>
    <span class="el-cta-cursor"></span>
  </a>
</div>

<svg id="el-svg" xmlns="http://www.w3.org/2000/svg"></svg>

<script src="vendor/gsap/gsap.min.js"></script>
<script src="vendor/gsap/SplitText.min.js"></script>
<script src="vendor/gsap/ScrollTrigger.min.js"></script>
<script src="vendor/gsap/DrawSVGPlugin.min.js"></script>
<script src="vendor/gsap/MotionPathPlugin.min.js"></script>
<script src="vendor/gsap/CustomEase.min.js"></script>
<script src="vendor/gsap/ScrambleTextPlugin.min.js"></script>
<script src="vendor/gsap/EasePack.min.js"></script>
<script src="vendor/gsap/Observer.min.js"></script>
<script src="log/js/gsapInit.js"></script>
<script src="log/js/gsapEelog.js"></script>
<script>
(function(){
  var MIN_MS=900,t0=Date.now();
  function boot(){setTimeout(function(){
    if(window.__gsapHandled)return;
    if(window.__dismissOverlay){window.__dismissOverlay();return;}
    var ov=document.getElementById('el-overlay');if(ov)ov.style.display='none';
    document.documentElement.classList.remove('fonts-loading');
    document.documentElement.classList.add('fonts-loaded');
  },Math.max(0,MIN_MS-(Date.now()-t0)));}
  if(document.fonts&&document.fonts.load){
    Promise.race([document.fonts.load('1em XSZT'),new Promise(function(r){setTimeout(r,5000);})]).then(boot).catch(boot);
  }else{setTimeout(boot,MIN_MS);}
})();
</script>
</body>
</html>
